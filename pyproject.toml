[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibridge"
version = "0.1.0"
description = "Autonomous In-Transit Cross-Chain Execution System"
authors = [{ name = "Omnibridge Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "web3>=6.0.0",
    "eth-account>=0.8.0",
    "eth-abi>=4.0.0",
    "langgraph>=0.6.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
omnibridge = "omnibridge.cli:main"

# Flat layout: without this, setuptools finds `static`, `skills` and `omnibridge`
# as candidate top-level packages and refuses to guess, so `pip install -e .` fails
# outright. graph/server/tools are top-level modules the package imports by name.
[tool.setuptools.packages.find]
include = ["omnibridge*"]

[tool.setuptools]
py-modules = ["graph", "server", "tools"]

[tool.pytest.ini_options]
markers = [
    "network: touches a live RPC or the public chain registry",
]
